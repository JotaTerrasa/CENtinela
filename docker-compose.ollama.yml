services:
  centinela:
    environment:
      AI_PROVIDER: ollama
      EMBEDDING_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434/v1
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-ollama-local}
      OLLAMA_PLANNER_MODEL: ${OLLAMA_PLANNER_MODEL:-qwen3.5:9b}
      OLLAMA_FILTER_MODEL: ${OLLAMA_FILTER_MODEL:-qwen3.5:9b}
      OLLAMA_REPORT_MODEL: ${OLLAMA_REPORT_MODEL:-qwen3.5:9b}
      OLLAMA_JUDGE_MODEL: ${OLLAMA_JUDGE_MODEL:-qwen3.5:9b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
    depends_on:
      ollama:
        condition: service_healthy
      ollama-bootstrap:
        condition: service_completed_successfully

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.32.5@sha256:4dea9fb511947e24a84237bb636b0203abcb2ff0d3fbc7b4ff865deb91362131}
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_QUEUE: ${OLLAMA_MAX_QUEUE:-32}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    tmpfs:
      - /tmp:size=512m,mode=1777
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  ollama-bootstrap:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.32.5@sha256:4dea9fb511947e24a84237bb636b0203abcb2ff0d3fbc7b4ff865deb91362131}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        pulled="|"
        for model in \
          "$${OLLAMA_PLANNER_MODEL}" \
          "$${OLLAMA_FILTER_MODEL}" \
          "$${OLLAMA_REPORT_MODEL}" \
          "$${OLLAMA_JUDGE_MODEL}" \
          "$${OLLAMA_EMBEDDING_MODEL}"
        do
          case "$${pulled}" in
            *"|$${model}|"*) ;;
            *)
              ollama pull "$${model}"
              pulled="$${pulled}$${model}|"
              ;;
          esac
        done
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_PLANNER_MODEL: ${OLLAMA_PLANNER_MODEL:-qwen3.5:9b}
      OLLAMA_FILTER_MODEL: ${OLLAMA_FILTER_MODEL:-qwen3.5:9b}
      OLLAMA_REPORT_MODEL: ${OLLAMA_REPORT_MODEL:-qwen3.5:9b}
      OLLAMA_JUDGE_MODEL: ${OLLAMA_JUDGE_MODEL:-qwen3.5:9b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
    depends_on:
      ollama:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    tmpfs:
      - /tmp:size=64m,mode=1777
    restart: "no"

volumes:
  ollama-models:
