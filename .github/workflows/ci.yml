name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app.py core scrapers agent rag scripts
      - run: ruff check .
      - run: pip-audit -r requirements.txt --progress-spinner off
      - run: pytest
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.ollama.yml config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.ollama.yml -f docker-compose.ollama-gpu.yml config --quiet
