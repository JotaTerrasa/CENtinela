name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app.py core scrapers agent rag scripts
      - run: ruff check .
      - name: Audit dependencies with documented Chroma server exceptions
        run: >-
          pip-audit -r requirements.txt --progress-spinner off
          --ignore-vuln CVE-2026-45830
          --ignore-vuln CVE-2026-45831
          --ignore-vuln CVE-2026-45833
      - run: pytest
      - name: Prepare non-secret Compose configuration
        run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.ollama.yml config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.ollama.yml -f docker-compose.ollama-gpu.yml config --quiet
